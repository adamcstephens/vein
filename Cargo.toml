[package]
name = "vein"
version = "0.4.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
clap_complete = "4.5.61"
dialoguer = "0.12.0"
reqwest = { version = "0.13.2", features = ["json", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rmcp = { version = "1.2.0", features = ["server", "transport-io"] }
tokio = { version = "1.50.0", features = ["macros", "rt"] }
pulldown-cmark = "0.13.0"
htmd = "0.5.1"

[dev-dependencies]
rmcp = { version = "1.2.0", features = ["client", "transport-io"] }
tokio = { version = "1.50.0", features = ["macros", "rt", "io-util"] }

