[package]
name = "vein"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.2", features = ["json", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rmcp = { version = "1.2.0", features = ["server", "transport-io"] }
tokio = { version = "1.50.0", features = ["macros", "rt"] }