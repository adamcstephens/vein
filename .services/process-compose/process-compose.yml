processes:
  vikunja:
    command: vikunja web
    working_dir: .services/vikunja
    readiness_probe:
      http_get:
        host: localhost
        port: 3456
        path: /api/v1/info

  provision:
    command: .services/vikunja/provision.sh
    depends_on:
      vikunja:
        condition: process_healthy
    availability:
      restart: "no"
